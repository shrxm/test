name: JumpMapDonation
version: '1.0.0'
main: com.jumpmap.donation.JumpMapDonationPlugin
api-version: '1.16'
author: YourName
description: SSAPI-Minecraft 후원 연동 점프맵 방해 효과 플러그인

commands:
  jumpmapdonate:
    description: SSAPI 후원 발생 시 호출되는 명령어 (콘솔에서 SSAPI가 자동 실행)
    usage: /jumpmapdonate <플레이어> <금액> [후원자닉네임]
  jmprice:
    description: 후원 항목별 가격 및 설정 관리
    usage: /jmprice <list|set|mode|spawn> ...
    permission: jumpmapdonation.admin

permissions:
  jumpmapdonation.admin:
    description: JumpMapDonation 관리자 명령어 사용 권한
    default: op
